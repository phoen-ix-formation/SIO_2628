<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Les types de champs - Formulaire</title>
    <style>
        div { margin: 5px 0; }
    </style>
</head>
<body>

    <h1>Les types de champs - Formulaire</h1>

    <form method="POST" action="http://localhost:9090/server.php">

        <div>
            <label for="checkbox">Checkbox</label>
            <input type="checkbox" name="checkbox" id="checkbox_1" />
            <input type="checkbox" name="checkbox" id="checkbox_2" />
            <input type="checkbox" name="checkbox" id="checkbox_3" />
        </div>
        
        <div>
            <label for="checkbox">Color</label>
            <input type="color" name="color" id="color" />
        </div>
        
        <div>
            <label for="date">Date</label>
            <input type="date" name="date" id="date" />
        </div>
        
        <div>
            <label for="datetime-local">Datetime - Local</label>
            <input type="datetime-local" name="datetime-local" id="datetime-local" />
        </div>
        
        <div>
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" />
        </div>
        
        <div>
            <label for="file">File</label>
            <input type="file" name="file" id="file" />
        </div>
        
        <div>
            <label for="hidden">Hidden</label>
            <input type="hidden" name="hidden" id="hidden" />
        </div>
        
        <div>
            <label for="month">Month</label>
            <input type="month" name="month" id="month" />
        </div>
        
        <div>
            <label for="number">Number</label>
            <input type="number" name="number" id="number" />
        </div>
        
        <div>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" />
        </div>
        
        <div>
            <label for="radio">Radio</label>
            <input type="radio" name="radio" id="radio_1" />
            <input type="radio" name="radio" id="radio_2" />
            <input type="radio" name="radio" id="radio_3" />
        </div>
        
        <div>
            <label for="range">Range</label>
            <input type="range" name="range" id="range" />
        </div>
        
        <div>
            <label for="search">Search</label>
            <input type="search" name="search" id="search" />
        </div>
        
        <div>
            <label for="tel">Tel</label>
            <input type="tel" name="tel" id="tel" />
        </div>
        
        <div>
            <label for="text">Text</label>
            <input type="text" name="text" id="text" />
        </div>
        
        <div>
            <label for="time">Time</label>
            <input type="time" name="time" id="time" />
        </div>
        
        <div>
            <label for="url">URL</label>
            <input type="url" name="url" id="url" />
        </div>
        
        <div>
            <label for="week">Week</label>
            <input type="week" name="week" id="week" />
        </div>
        
        <div>
            <label for="button">Button</label>
            <input type="button" name="button" id="button" value="Bouton" />
        </div>

        <div>
            <label for="textarea">TextArea</label>
            <textarea id="textarea" name="textarea" rows="5"></textarea>
        </div>

        <div>
            <label for="select">Select</label>
            <select id="select" name="select">

                <option value="select_1">Option 1</option>
                <option value="select_2">Option 2</option>
                <option value="select_3">Option 3</option>
                <option value="select_4">Option 4</option>
            </select>
        </div>
        
        <div>
            <label for="reset">Reset</label>
            <input type="reset" name="reset" id="reset" />
        </div>
        
        <div>
            <label for="submit">Submit</label>
            <input type="submit" name="submit" id="submit" />
        </div>
    </form>

</body>
</html>
